<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="ican" type="image/png" href="./assets/logo.png">
  <title>ProductivityPulse — Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; color: #1e293b; padding: 32px; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 28px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; margin-bottom: 16px; }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #0f172a; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .row:last-child { border-bottom: none; }
    .label { font-size: 14px; color: #374151; font-weight: 500; }
    .desc  { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .toggle { position: relative; width: 44px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 24px; cursor: pointer; transition: .2s; }
    .slider::before { content: ''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 4px; left: 4px; transition: .2s; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    input:checked + .slider { background: #3b82f6; }
    input:checked + .slider::before { transform: translateX(20px); }
    input.input { width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; }
    input.input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .btn { padding: 8px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: .15s; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger  { background: #fee2e2; color: #dc2626; }
    .btn-danger:hover { background: #fecaca; }
    .site-list { margin-top: 12px; }
    .site-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f8fafc; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
    .add-row { display: flex; gap: 8px; margin-top: 12px; }
    .save-btn { display: block; width: 100%; padding: 12px; background: #3b82f6; color: #fff; font-size: 15px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; margin-top: 8px; }
    .save-btn:hover { background: #2563eb; }
    .toast { display: none; background: #22c55e; color: #fff; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
<div class="container">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
    <div style="width:40px;height:40px;background:linear-gradient(to right, #3b82f6, #8b5cf6, #ec4899);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;">
      <img src="./assets/logo.png" alt="logo" height="40px" width="40px">
    </div>
    <div><h1>ProductivityPulse</h1><p class="subtitle">Extension Options</p></div>
  </div>

  <div class="card">
    <h2>General Settings</h2>
    <div class="row">
      <div><div class="label">Enable Tracking</div><div class="desc">Record time spent on each website</div></div>
      <label class="toggle"><input type="checkbox" id="trackingEnabled"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><div class="label">Enable Blocking</div><div class="desc">Block sites on your blocklist</div></div>
      <label class="toggle"><input type="checkbox" id="blockingEnabled"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><div class="label">Cloud Sync</div><div class="desc">Sync data to the backend server</div></div>
      <label class="toggle"><input type="checkbox" id="syncEnabled"><span class="slider"></span></label>
    </div>
  </div>

  <div class="card">
    <h2>Blocked Websites</h2>
    <div class="site-list" id="siteList"></div>
    <div class="add-row">
      <input type="text" id="newSite" class="input" placeholder="e.g. facebook.com" />
      <button class="btn btn-primary" onclick="addSite()">+ Block</button>
    </div>
  </div>

  <div class="card">
    <h2>Backend Connection</h2>
    <div class="row">
      <div class="label">API Base URL</div>
    </div>
    <input type="text" id="apiBase" class="input" placeholder="http://localhost:5000/api" style="margin-top:8px;" />
    <div style="margin-top:12px;">
      <div class="label" style="margin-bottom:8px;">Auth Token (JWT)</div>
      <input type="password" id="authToken" class="input" placeholder="Paste JWT from the dashboard login" />
    </div>
  </div>

  <button class="save-btn" onclick="saveAll()">💾 Save All Settings</button>
  <div class="toast" id="toast">✓ Settings saved!</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let blockedSites = [];

async function load() {
  const { settings = {}, blockedSites: bs = [] } = await chrome.storage.local.get(['settings', 'blockedSites']);
  blockedSites = bs;
  $('trackingEnabled').checked = settings.trackingEnabled !== false;
  $('blockingEnabled').checked = settings.blockingEnabled !== false;
  $('syncEnabled').checked     = settings.syncEnabled !== false;
  $('apiBase').value           = settings.apiBase  || 'http://localhost:5000/api';
  $('authToken').value         = settings.authToken || '';
  renderSites();
}

function renderSites() {
  $('siteList').innerHTML = blockedSites.map((s) =>
    `<div class="site-item">
       <span>🚫 ${s}</span>
       <button class="btn btn-danger" onclick="removeSite('${s}')">Remove</button>
     </div>`
  ).join('') || '<p style="font-size:13px;color:#94a3b8;padding:8px 0;">No sites blocked yet.</p>';
}

function addSite() {
  const raw   = $('newSite').value.trim().toLowerCase().replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
  if (!raw || !/\.[a-z]{2,}/.test(raw)) return alert('Enter a valid domain (e.g. facebook.com)');
  if (!blockedSites.includes(raw)) blockedSites.push(raw);
  $('newSite').value = '';
  renderSites();
}

function removeSite(site) {
  blockedSites = blockedSites.filter((s) => s !== site);
  renderSites();
}

async function saveAll() {
  const settings = {
    trackingEnabled: $('trackingEnabled').checked,
    blockingEnabled: $('blockingEnabled').checked,
    syncEnabled:     $('syncEnabled').checked,
    apiBase:         $('apiBase').value.trim(),
    authToken:       $('authToken').value.trim() || null,
  };
  await chrome.storage.local.set({ settings, blockedSites });
  const t = $('toast');
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

load();
</script>
</body>
</html>
